<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoScript Lab — Audio & Video Transcription</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px;
    background: #0f172a;
    color: #e2e8f0;
  }
  h1 { color: #38bdf8; }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 20px;
    margin-top: 16px;
  }
  input[type=file] {
    width: 100%;
    padding: 12px;
    background: #0f172a;
    border: 1px dashed #38bdf8;
    border-radius: 8px;
    color: #e2e8f0;
  }
  button {
    margin-top: 12px;
    padding: 10px 20px;
    background: #38bdf8;
    color: #0f172a;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #status { margin-top: 12px; color: #94a3b8; }
  #output {
    white-space: pre-wrap;
    background: #0f172a;
    padding: 16px;
    border-radius: 8px;
    margin-top: 12px;
    min-height: 80px;
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<h1>EchoScript Lab</h1>
<p>Transcribe audio & video files directly in your browser. No upload, no server — 100% private.</p>

<div class="card">
  <input type="file" id="file" accept="audio/*,video/*">
  <button id="go" disabled>Transcribe</button>
  <div id="status">Waiting for file…</div>
</div>

<div class="card">
  <strong>Transcript</strong>
  <div id="output"></div>
  <button id="copy" style="display:none;">Copy transcript</button>
</div>

<script type="module">
import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

const fileInput = document.getElementById('file');
const goBtn     = document.getElementById('go');
const statusEl  = document.getElementById('status');
const outputEl  = document.getElementById('output');
const copyBtn   = document.getElementById('copy');

let transcriber = null;

fileInput.addEventListener('change', () => {
  goBtn.disabled = !fileInput.files.length;
  statusEl.textContent = fileInput.files.length
    ? 'Ready. Click Transcribe.'
    : 'Waiting for file…';
});

async function decodeToMono16k(file) {
  statusEl.textContent = 'Decoding audio…';
  const arrayBuffer = await file.arrayBuffer();
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
  // mix to mono
  const numCh = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;
  const mono = new Float32Array(length);
  for (let c = 0; c < numCh; c++) {
    const data = audioBuffer.getChannelData(c);
    for (let i = 0; i < length; i++) mono[i] += data[i] / numCh;
  }
  // resample to 16kHz if needed
  if (audioBuffer.sampleRate === 16000) return mono;
  const ratio = 16000 / audioBuffer.sampleRate;
  const newLen = Math.floor(length * ratio);
  const out = new Float32Array(newLen);
  for (let i = 0; i < newLen; i++) {
    const src = i / ratio;
    const i0 = Math.floor(src);
    const i1 = Math.min(i0 + 1, length - 1);
    const frac = src - i0;
    out[i] = mono[i0] * (1 - frac) + mono[i1] * frac;
  }
  return out;
}

goBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  goBtn.disabled = true;
  outputEl.textContent = '';
  copyBtn.style.display = 'none';

  try {
    const pcm = await decodeToMono16k(file);
    const seconds = (pcm.length / 16000).toFixed(1);
    statusEl.textContent = `Audio decoded (${seconds}s). Loading model…`;

    if (!transcriber) {
      transcriber = await pipeline(
        'automatic-speech-recognition',
        'Xenova/whisper-tiny.en'
      );
    }

    statusEl.textContent = 'Transcribing…';
    const result = await transcriber(pcm, {
      chunk_length_s: 30,
      stride_length_s: 5,
      return_timestamps: false
    });

    outputEl.textContent = result.text?.trim() || '(no speech detected)';
    copyBtn.style.display = 'inline-block';
    statusEl.textContent = 'Done ✅';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    goBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(outputEl.textContent);
  copyBtn.textContent = 'Copied!';
  setTimeout(() => copyBtn.textContent = 'Copy transcript', 1500);
});
</script>

</body>
</html>
