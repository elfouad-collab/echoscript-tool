<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EchoScript Lab — Audio & Video Transcription</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #131c2e;
    --panel-2: #1a2540;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --text: #e6edf6;
    --muted: #94a3b8;
    --border: #24304a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: radial-gradient(circle at 20% 0%, #16213e 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 40px 20px 60px; }
  header { text-align: center; margin-bottom: 32px; }
  h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
  }
  header p { color: var(--muted); margin: 0; font-size: 1rem; }
  .card {
    background: linear-gradient(180deg, var(--panel) 0%, var(--panel-2) 100%);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
  select, input[type=file] {
    width: 100%;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 0.95rem;
    margin-bottom: 14px;
  }
  input[type=file] { border-style: dashed; }
  input[type=file]:hover { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  button {
    padding: 12px 22px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: #0b1220;
    border: none;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(56,189,248,0.35); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .status { margin-top: 14px; color: var(--muted); font-size: 0.9rem; min-height: 1.2em; }
  .progress-track {
    height: 8px;
    background: var(--bg);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 14px;
    display: none;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.3s ease;
  }
  #output {
    white-space: pre-wrap;
    line-height: 1.65;
    font-size: 1rem;
    min-height: 120px;
    color: var(--text);
  }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .hidden { display: none !important; }
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>EchoScript Lab</h1>
    <p>Transcribe audio & video in your browser — private, no uploads.</p>
  </header>

  <div class="card">
    <label for="file">Choose an audio or video file</label>
    <input type="file" id="file" accept="audio/*,video/*">

    <div class="row">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="Xenova/whisper-tiny.en">Tiny (English, fast)</option>
          <option value="Xenova/whisper-tiny">Tiny (Multilingual, fast)</option>
          <option value="Xenova/whisper-base.en">Base (English, balanced)</option>
          <option value="Xenova/whisper-base">Base (Multilingual, balanced)</option>
        </select>
      </div>
      <div>
        <label for="language">Language</label>
        <select id="language">
          <option value="auto">Auto-detect</option>
          <option value="en">English</option>
          <option value="ar">Arabic</option>
          <option value="fr">French</option>
          <option value="es">Spanish</option>
          <option value="de">German</option>
          <option value="tr">Turkish</option>
        </select>
      </div>
    </div>

    <button id="go" disabled>Transcribe</button>
    <div class="status" id="status">Waiting for file…</div>
    <div class="progress-track" id="track"><div class="progress-fill" id="fill"></div></div>
  </div>

  <div class="card">
    <label>Transcript</label>
    <div id="output">Your transcript will appear here.</div>
    <div class="actions hidden" id="actions">
      <button id="copy" class="secondary">Copy</button>
      <button id="download" class="secondary">Download .txt</button>
    </div>
  </div>

  <footer>EchoScript Lab · Runs locally with Transformers.js · Powered by Whisper</footer>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

env.allowLocalModels = false;

const fileInput = document.getElementById('file');
const goBtn = document.getElementById('go');
const statusEl = document.getElementById('status');
const outputEl = document.getElementById('output');
const copyBtn = document.getElementById('copy');
const dlBtn = document.getElementById('download');
const actions = document.getElementById('actions');
const track = document.getElementById('track');
const fill = document.getElementById('fill');
const modelSel = document.getElementById('model');
const langSel = document.getElementById('language');

let transcriber = null;
let loadedModel = null;

fileInput.addEventListener('change', () => {
  goBtn.disabled = !fileInput.files.length;
  statusEl.textContent = fileInput.files.length ? 'Ready. Click Transcribe.' : 'Waiting for file…';
});

function setProgress(p) {
  track.style.display = 'block';
  fill.style.width = (p * 100).toFixed(1) + '%';
}

async function decodeToMono16k(file) {
  statusEl.textContent = 'Decoding audio…';
  const buf = await file.arrayBuffer();
  const ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
  const audio = await ctx.decodeAudioData(buf);
  const ch = audio.numberOfChannels;
  const len = audio.length;
  const mono = new Float32Array(len);
  for (let c = 0; c < ch; c++) {
    const d = audio.getChannelData(c);
    for (let i = 0; i < len; i++) mono[i] += d[i] / ch;
  }
  if (audio.sampleRate === 16000) return mono;
  const ratio = 16000 / audio.sampleRate;
  const out = new Float32Array(Math.floor(len * ratio));
  for (let i = 0; i < out.length; i++) {
    const s = i / ratio, i0 = Math.floor(s), i1 = Math.min(i0 + 1, len - 1);
    out[i] = mono[i0] * (1 - (s - i0)) + mono[i1] * (s - i0);
  }
  return out;
}

goBtn.addEventListener('click', async () => {
  const file = fileInput.files[0];
  if (!file) return;

  goBtn.disabled = true;
  outputEl.textContent = '';
  actions.classList.add('hidden');
  fill.style.width = '0%';

  try {
    const pcm = await decodeToMono16k(file);
    const dur = pcm.length / 16000;
    statusEl.textContent = `Decoded ${dur.toFixed(1)}s. Loading model…`;
    setProgress(0.1);

    const wanted = modelSel.value;
    if (!transcriber || loadedModel !== wanted) {
      transcriber = await pipeline('automatic-speech-recognition', wanted);
      loadedModel = wanted;
    }

    const chunkSamples = 16000 * 30; // 30-second chunks
    const total = pcm.length;
    const chunks = [];
    for (let i = 0; i < total; i += chunkSamples) {
      chunks.push(pcm.subarray(i, Math.min(i + chunkSamples, total)));
    }

    const lang = langSel.value;
    const opts = { task: 'transcribe' };
    if (lang !== 'auto') opts.language = lang;

    let full = '';
    for (let i = 0; i < chunks.length; i++) {
      statusEl.textContent = `Transcribing chunk ${i + 1}/${chunks.length}…`;
      setProgress(0.15 + (i / chunks.length) * 0.8);
      const res = await transcriber(chunks[i], opts);
      full += (res.text || '') + ' ';
    }

    outputEl.textContent = full.trim() || '(no speech detected)';
    actions.classList.remove('hidden');
    statusEl.textContent = 'Done ✅';
    setProgress(1);
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Error: ' + err.message;
  } finally {
    goBtn.disabled = false;
  }
});

copyBtn.addEventListener('click', () => {
  navigator.clipboard.writeText(outputEl.textContent);
  copyBtn.textContent = 'Copied!';
  setTimeout(() => copyBtn.textContent = 'Copy', 1500);
});

dlBtn.addEventListener('click', () => {
  const blob = new Blob([outputEl.textContent], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'echoscript-transcript.txt';
  a.click();
});
</script>
</body>
</html>
